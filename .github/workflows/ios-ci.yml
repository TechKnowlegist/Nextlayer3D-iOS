name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-simulator:
    # macos-14's own default Xcode turned out to be 15.4, which can't read
    # the pbxproj format brew's always-latest XcodeGen writes ("future
    # Xcode project file format (77)" — hit on two prior runs). macos-15
    # ships a newer Xcode by default, which is a better match for that.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls -d /Applications/Xcode*.app

      - name: Select the newest available Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$NEWEST" ]; then NEWEST=/Applications/Xcode.app; fi
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # A concrete device, not just "generic/platform=iOS Simulator" — the
      # generic destination is documented to break aws-sdk-swift's
      # SmithyCodeGeneratorPlugin (it builds a host-side CLI tool as part
      # of code generation, and its output lands somewhere the generic/
      # archive-style build doesn't look — see awslabs/aws-sdk-swift#2224
      # for the same underlying UninstalledProducts-path issue on a
      # different generic-style build). Building against a real device,
      # same as any normal "hit Run in Xcode" flow, avoids it.
      - name: Pick a simulator device
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available | grep -m1 -oE "^\s*iPhone [^(]+" | sed -e 's/^ *//' -e 's/ *$//')
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 "$DEVICE_NAME (" | grep -oE '[0-9A-F-]{36}')
          echo "Using simulator: $DEVICE_NAME ($DEVICE_ID)"
          echo "DEVICE_NAME=$DEVICE_NAME" >> "$GITHUB_ENV"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Boot the simulator
        run: |
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Nextlayer3D.xcodeproj \
            -scheme Nextlayer3D \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Everything below actually launches the built app against the real
      # AWS backend (same Cognito/AppSync/S3 the website uses — GitHub's
      # runners have real internet access) and screenshots it, so there's
      # something to actually look at without needing a Mac, an Apple
      # Developer account, or any signing.

      - name: Install and launch the app
        run: |
          APP_PATH=$(find DerivedData -name "Nextlayer3D.app" -path "*iphonesimulator*" | head -n1)
          echo "Installing $APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.nextlayer3d.app
          sleep 10

      - name: Screenshot the running app
        run: |
          mkdir -p screenshots
          xcrun simctl io "$DEVICE_ID" screenshot screenshots/app-launch.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: screenshots/
          if-no-files-found: ignore
