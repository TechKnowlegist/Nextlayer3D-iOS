name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-simulator:
    # macos-14's own default Xcode turned out to be 15.4, which can't read
    # the pbxproj format brew's always-latest XcodeGen writes ("future
    # Xcode project file format (77)" — hit on two prior runs). macos-15
    # ships a newer Xcode by default, which is a better match for that.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls -d /Applications/Xcode*.app

      - name: Select the newest available Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$NEWEST" ]; then NEWEST=/Applications/Xcode.app; fi
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # A concrete device, not just "generic/platform=iOS Simulator" — the
      # generic destination is documented to break aws-sdk-swift's
      # SmithyCodeGeneratorPlugin (it builds a host-side CLI tool as part
      # of code generation, and its output lands somewhere the generic/
      # archive-style build doesn't look — see awslabs/aws-sdk-swift#2224
      # for the same underlying UninstalledProducts-path issue on a
      # different generic-style build). Building against a real device,
      # same as any normal "hit Run in Xcode" flow, avoids it.
      - name: Pick a simulator device
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available | grep -m1 -oE "^\s*iPhone [^(]+" | sed -e 's/^ *//' -e 's/ *$//')
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 "$DEVICE_NAME (" | grep -oE '[0-9A-F-]{36}')
          echo "Using simulator: $DEVICE_NAME ($DEVICE_ID)"
          echo "DEVICE_NAME=$DEVICE_NAME" >> "$GITHUB_ENV"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Boot the simulator
        run: |
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Nextlayer3D.xcodeproj \
            -scheme Nextlayer3D \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Everything below actually launches the built app against the real
      # AWS backend (same Cognito/AppSync/S3 the website uses — GitHub's
      # runners have real internet access) and screenshots it, so there's
      # something to actually look at without needing a Mac, an Apple
      # Developer account, or any signing.

      - name: Install and launch the app
        run: |
          APP_PATH=$(find DerivedData -name "Nextlayer3D.app" -path "*iphonesimulator*" | head -n1)
          echo "Installing $APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.nextlayer3d.app
          sleep 10

      - name: Screenshot the running app
        run: |
          mkdir -p screenshots
          xcrun simctl io "$DEVICE_ID" screenshot screenshots/app-launch.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: screenshots/
          if-no-files-found: ignore

  # Builds a real, installable .ipa for a physical iPhone (not the
  # Simulator). It's deliberately left UNSIGNED — no Apple Developer
  # account or certificate involved. AltStore does its own signing (using
  # your free personal Apple ID) at install time, so an unsigned .ipa is
  # exactly what it expects. On every push to main, the .ipa and an
  # AltStore "source" JSON are published to a rolling "latest" GitHub
  # Release, so AltStore on your phone can see new builds as they land.
  build-device-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest available Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$NEWEST" ]; then NEWEST=/Applications/Xcode.app; fi
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app for a real iPhone
        run: |
          xcodebuild \
            -project Nextlayer3D.xcodeproj \
            -scheme Nextlayer3D \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${GITHUB_SHA::7}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build

      - name: Package the .app into an .ipa
        run: |
          APP_PATH=$(find DerivedData -name "Nextlayer3D.app" -path "*iphoneos*" | head -n1)
          echo "Packaging $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q Nextlayer3D.ipa Payload
          echo "IPA_SIZE=$(stat -f%z Nextlayer3D.ipa)" >> "$GITHUB_ENV"

      - name: Upload .ipa as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nextlayer3D-ipa
          path: Nextlayer3D.ipa

      - name: Write the AltStore source feed
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cat > altstore-source.json <<EOF
          {
            "name": "Nextlayer3D",
            "identifier": "com.nextlayer3d.altstore-source",
            "apps": [
              {
                "name": "Nextlayer3D",
                "bundleIdentifier": "com.nextlayer3d.app",
                "developerName": "TechKnowlegist",
                "version": "${GITHUB_SHA::7}",
                "versionDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "versionDescription": "Automatic build from commit ${GITHUB_SHA::7}.",
                "downloadURL": "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/Nextlayer3D.ipa",
                "localizedDescription": "Native iPhone companion app for Nextlayer3D — Phase 1 (core commerce).",
                "iconURL": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/icon.png",
                "size": ${IPA_SIZE}
              }
            ]
          }
          EOF

      - name: Publish to the rolling "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: >
            Automatically rebuilt from the latest commit on main. This is an
            unsigned .ipa — install or update it through AltStore using the
            source feed URL in SETUP.md, not by downloading it directly.
          make_latest: true
          files: |
            Nextlayer3D.ipa
            altstore-source.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
