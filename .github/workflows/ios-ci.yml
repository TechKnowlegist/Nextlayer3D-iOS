name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-simulator:
    # Pinned to a specific macOS version (not "latest") so the runner
    # image itself doesn't silently drift over time. Xcode is deliberately
    # NOT pinned here: `brew install xcodegen` always installs the latest
    # XcodeGen, which generates project files in whatever pbxproj format
    # its own release targets — pinning to an older Xcode than that
    # produces "future Xcode project file format" errors (hit exactly this
    # on the first run, pinned to 15.4). The runner's own default Xcode is
    # kept reasonably current by GitHub, so it's a better match for
    # brew's always-latest XcodeGen than a version guessed here.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Nextlayer3D.xcodeproj \
            -scheme Nextlayer3D \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
